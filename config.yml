default:
  # --------------------------------------------------------------------------
  # Project Metadata
  # --------------------------------------------------------------------------
  project_type: presentation  # Type: project, course, or presentation

  # Presenter information (used in slides, handouts, etc.)
  author:
    name: "Erik Westlund"
    email: "ewestlund@jhu.edu"
    affiliation: "Johns Hopkins Bloomberg School of Public Health"

  # --------------------------------------------------------------------------
  # Package Dependencies
  # --------------------------------------------------------------------------
  # Minimal packages for presentations
  # Use auto_attach: true to load automatically, false to install only
  # --------------------------------------------------------------------------
  packages:
    - name: tidyverse
      auto_attach: true
    - name: ggdag
      auto_attach: true
    - name: kableExtra
      auto_attach: true
    - name: broom
      auto_attach: true
    - name: scales
      auto_attach: true
    - name: gridExtra
      auto_attach: true

  # --------------------------------------------------------------------------
  # Project Directories
  # --------------------------------------------------------------------------
  directories:
    notebooks: "."                # Presentation files in root (with presentation.qmd)
    functions: functions          # Helper functions
    cache: data/cached            # Cached computation results

  # --------------------------------------------------------------------------
  # Project Behavior
  # --------------------------------------------------------------------------
  # Default notebook format for make_notebook() (quarto or rmarkdown)
  default_notebook_format: quarto

  # --------------------------------------------------------------------------
  # Data Catalog
  # --------------------------------------------------------------------------
  # Simple inline for most presentations
  #
  # Fields:
  #   - path: File path relative to project root
  #   - type: csv, rds, xlsx, etc.
  #   - locked: true prevents accidental modification
  #   - description: Displayed when data is loaded with data_load()
  # --------------------------------------------------------------------------
  data:
    base_population:
      path: data/base_population.csv
      type: csv
      locked: true
      description: "Base population with Age, Gender, and GOC structure used across all examples"

    sim1_data:
      path: data/sim1_data.csv
      type: csv
      locked: true
      description: "Simulation 1: Age → Outcome only (no confounding)"

    sim2_data:
      path: data/sim2_data.csv
      type: csv
      locked: true
      description: "Simulation 2: Age + Gender → Outcome (Simpson's Paradox)"

    sim3_data:
      path: data/sim3_data.csv
      type: csv
      locked: true
      description: "Simulation 3: Age + Gender + GOC → Outcome (multiple confounding)"

  # --------------------------------------------------------------------------
  # Database Connections
  # --------------------------------------------------------------------------
  connections:
    framework:
      driver: "sqlite"
      database: "framework.db"

  # --------------------------------------------------------------------------
  # AI Assistant Configuration
  # --------------------------------------------------------------------------
  ai:
    canonical_file: "CLAUDE.md"

  # --------------------------------------------------------------------------
  # Git Hooks
  # --------------------------------------------------------------------------
  git:
    hooks:
      ai_sync: true
      data_security: true
